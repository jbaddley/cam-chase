name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Phase 1 exit criterion (docs/09-roadmap.md): a bot-driven full game must
      # reach its expected scoreboard. Run separately so a break in the game loop
      # is obvious in the build log rather than buried in the unit-test output.
      - name: Full-game simulation
        run: pnpm --filter @photochase/api exec vitest run simulation
