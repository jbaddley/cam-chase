name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Typecheck alone misses bundler-level breakage (the web app failed to
      # build for a while because Next could not resolve the workspace
      # packages' ESM specifiers).
      - name: Build
        run: pnpm build

      # Synth validates the construct tree — it catches things typecheck cannot,
      # such as Cognito's provider-name length rule. No AWS credentials needed.
      - name: CDK synth
        run: pnpm --filter @photochase/infra synth -- --quiet

      # Web E2E (docs 05, 09). Hermetic: the suite stubs every API call, so no
      # backend is needed. Uses the runner's Chromium when CHROMIUM_PATH points
      # at one, otherwise the browser Playwright installs below.
      - name: Install Playwright browser
        run: pnpm --filter @photochase/web exec playwright install --with-deps chromium

      - name: Web E2E
        run: pnpm --filter @photochase/web test:e2e

      # Phase 1 exit criterion (docs/09-roadmap.md): a bot-driven full game must
      # reach its expected scoreboard. Run separately so a break in the game loop
      # is obvious in the build log rather than buried in the unit-test output.
      - name: Full-game simulation
        run: pnpm --filter @photochase/api exec vitest run simulation
